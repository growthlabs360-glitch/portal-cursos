<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal de Cursos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   VARIABLES Y RESET
========================================================= */
:root {
  --bg:         #0a0a0a;
  --bg2:        #111111;
  --bg3:        #1a1a1a;
  --bg4:        #222222;
  --orange:     #FF6B2B;
  --orange-dk:  #CC4A10;
  --orange-glow:rgba(255,107,43,0.35);
  --text:       #F5F0EB;
  --text-muted: #9a9490;
  --border:     #2a2a2a;
  --sidebar-w:  300px;
  --header-h:   64px;
  --radius:     12px;
  --trans:      250ms ease;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:'DM Sans',sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:15px;
  line-height:1.6;
}
/* Noise grain overlay */
body::after{
  content:'';
  position:fixed;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events:none;z-index:9999;opacity:.6;
}

/* =========================================================
   SCROLLBAR
========================================================= */
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--orange)}

/* =========================================================
   SCREEN SWITCHER
========================================================= */
.screen{
  position:fixed;inset:0;
  opacity:0;pointer-events:none;
  transition:opacity 400ms ease;
  z-index:10;
}
.screen.active{opacity:1;pointer-events:all;z-index:20}

/* =========================================================
   LOGIN SCREEN
========================================================= */
#loginScreen{
  display:flex;align-items:center;justify-content:center;
  background:var(--bg);
  background-image:
    radial-gradient(ellipse 60% 50% at 50% -10%, rgba(255,107,43,.18) 0%, transparent 70%);
}
.login-box{
  width:100%;max-width:420px;
  padding:48px 40px;
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:20px;
  box-shadow:0 0 60px rgba(0,0,0,.6);
  text-align:center;
  position:relative;
  overflow:hidden;
}
.login-box::before{
  content:'';
  position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--orange),transparent);
}
.login-logo{
  font-family:'Bebas Neue',sans-serif;
  font-size:42px;letter-spacing:3px;
  color:var(--text);
  margin-bottom:8px;
}
.login-logo span{color:var(--orange)}
.login-subtitle{
  color:var(--text-muted);font-size:13px;
  margin-bottom:36px;
}
.login-label{
  display:block;text-align:left;
  font-size:12px;font-weight:600;
  letter-spacing:.8px;text-transform:uppercase;
  color:var(--text-muted);margin-bottom:8px;
}
.login-input{
  width:100%;padding:14px 16px;
  background:var(--bg3);
  border:1.5px solid var(--border);
  border-radius:var(--radius);
  color:var(--text);font-size:16px;
  font-family:'DM Sans',sans-serif;
  outline:none;
  transition:border-color var(--trans),box-shadow var(--trans);
  letter-spacing:4px;
}
.login-input:focus{
  border-color:var(--orange);
  box-shadow:0 0 0 3px var(--orange-glow);
}
.login-btn{
  width:100%;margin-top:20px;
  padding:15px;
  background:var(--orange);
  border:none;border-radius:var(--radius);
  color:#fff;font-size:15px;font-weight:700;
  font-family:'DM Sans',sans-serif;
  letter-spacing:.5px;
  cursor:pointer;
  transition:background var(--trans),transform var(--trans),box-shadow var(--trans);
}
.login-btn:hover{
  background:var(--orange-dk);
  transform:translateY(-1px);
  box-shadow:0 6px 24px rgba(255,107,43,.4);
}
.login-btn:active{transform:translateY(0)}
.login-error{
  margin-top:14px;height:20px;
  font-size:13px;color:#ff5555;
  opacity:0;transition:opacity .2s;
}
.login-error.show{opacity:1;animation:shake .4s ease}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%,60%{transform:translateX(-6px)}
  40%,80%{transform:translateX(6px)}
}
.lock-icon{
  font-size:40px;margin-bottom:16px;
  filter:drop-shadow(0 0 12px var(--orange-glow));
}

/* =========================================================
   APP SCREEN (HEADER + SIDEBAR + MAIN)
========================================================= */
#appScreen{
  display:flex;flex-direction:column;
  height:100%;
}
/* --- HEADER --- */
.header{
  position:fixed;top:0;left:0;right:0;height:var(--header-h);
  background:rgba(10,10,10,.92);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;
  padding:0 20px;gap:16px;
  z-index:100;
}
.header-logo{
  font-family:'Bebas Neue',sans-serif;
  font-size:24px;letter-spacing:2px;
  white-space:nowrap;flex-shrink:0;
}
.header-logo span{color:var(--orange)}
.header-progress{
  flex:1;display:flex;align-items:center;gap:12px;
  max-width:420px;margin:0 auto;
}
.header-progress-label{
  font-size:12px;color:var(--text-muted);
  white-space:nowrap;
}
.progress-bar-wrap{
  flex:1;height:6px;
  background:var(--bg4);border-radius:99px;
  overflow:hidden;
}
.progress-bar-fill{
  height:100%;
  background:linear-gradient(90deg,var(--orange-dk),var(--orange));
  border-radius:99px;
  transition:width 600ms cubic-bezier(.4,0,.2,1);
}
.header-actions{display:flex;align-items:center;gap:10px;flex-shrink:0}
.btn-logout{
  padding:8px 16px;
  background:transparent;
  border:1.5px solid var(--border);
  border-radius:8px;color:var(--text-muted);
  font-size:12px;font-weight:600;
  font-family:'DM Sans',sans-serif;
  letter-spacing:.5px;cursor:pointer;
  transition:all var(--trans);
}
.btn-logout:hover{border-color:var(--orange);color:var(--orange)}
.hamburger{
  display:none;flex-direction:column;gap:5px;
  background:none;border:none;cursor:pointer;padding:4px;
}
.hamburger span{
  display:block;width:22px;height:2px;
  background:var(--text);border-radius:2px;
  transition:all var(--trans);
}
.hamburger.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.hamburger.open span:nth-child(2){opacity:0}
.hamburger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}

/* --- LAYOUT --- */
.app-body{
  display:flex;
  margin-top:var(--header-h);
  height:calc(100vh - var(--header-h));
  overflow:hidden;
}

/* --- SIDEBAR --- */
.sidebar{
  width:var(--sidebar-w);flex-shrink:0;
  background:var(--bg2);
  border-right:1px solid var(--border);
  overflow-y:auto;
  display:flex;flex-direction:column;
  transition:transform var(--trans);
}
.sidebar-inner{padding:16px 0 80px}
.sidebar-section-title{
  font-size:10px;font-weight:700;
  letter-spacing:1.5px;text-transform:uppercase;
  color:var(--text-muted);
  padding:8px 20px 12px;
}

/* Module item */
.module-item{margin-bottom:4px}
.module-header{
  display:flex;align-items:center;gap:10px;
  padding:12px 20px;cursor:pointer;
  transition:background var(--trans);
  position:relative;
}
.module-header:hover{background:var(--bg3)}
.module-chevron{
  width:18px;height:18px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  transition:transform var(--trans);color:var(--text-muted);font-size:12px;
}
.module-item.open .module-chevron{transform:rotate(90deg)}
.module-meta{flex:1;min-width:0}
.module-name{
  font-size:13px;font-weight:600;
  line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.module-sub{
  font-size:11px;color:var(--text-muted);margin-top:2px;
}
.module-badge{
  font-size:10px;font-weight:700;letter-spacing:.5px;
  background:var(--orange);color:#fff;
  padding:2px 7px;border-radius:99px;
  flex-shrink:0;opacity:0;transition:opacity .3s;
}
.module-badge.show{opacity:1}

/* Module progress bar */
.module-prog{
  margin:0 20px 10px;height:3px;
  background:var(--bg4);border-radius:99px;overflow:hidden;
}
.module-prog-fill{
  height:100%;background:var(--orange);
  border-radius:99px;transition:width 500ms ease;
}

/* Lessons list */
.lessons-list{
  overflow:hidden;
  max-height:0;
  transition:max-height 350ms cubic-bezier(.4,0,.2,1);
}
.module-item.open .lessons-list{max-height:600px}

/* Lesson item */
.lesson-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 20px 10px 42px;
  cursor:pointer;
  transition:background var(--trans);
  position:relative;
  border-left:2px solid transparent;
}
.lesson-item:hover{background:var(--bg3)}
.lesson-item.active{
  background:rgba(255,107,43,.08);
  border-left-color:var(--orange);
}
.lesson-item.active .lesson-title{color:var(--orange)}
.lesson-check{
  width:18px;height:18px;flex-shrink:0;
  border:1.5px solid var(--border);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:9px;color:transparent;
  transition:all var(--trans);cursor:pointer;
  position:relative;z-index:2;
}
.lesson-check.done{
  background:var(--orange);border-color:var(--orange);color:#fff;
}
.lesson-info{flex:1;min-width:0}
.lesson-title{
  font-size:13px;line-height:1.3;
  transition:color var(--trans);
}
.lesson-duration{
  font-size:11px;color:var(--text-muted);margin-top:1px;
}

/* =========================================================
   MAIN CONTENT
========================================================= */
.main{
  flex:1;overflow-y:auto;
  padding:28px 32px 60px;
}

/* --- DASHBOARD --- */
#dashboard{display:none}
#dashboard.visible{display:block}

.dash-greeting{
  font-family:'Bebas Neue',sans-serif;
  font-size:52px;letter-spacing:2px;
  line-height:1;margin-bottom:6px;
}
.dash-greeting span{color:var(--orange)}
.dash-subtitle{
  color:var(--text-muted);font-size:15px;
  margin-bottom:32px;
}

/* Stats cards */
.stats-row{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:14px;margin-bottom:32px;
}
.stat-card{
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:20px;
  transition:border-color var(--trans),transform var(--trans);
}
.stat-card:hover{border-color:var(--orange);transform:translateY(-2px)}
.stat-value{
  font-family:'Bebas Neue',sans-serif;
  font-size:42px;color:var(--orange);
  line-height:1;
}
.stat-label{
  font-size:12px;color:var(--text-muted);
  text-transform:uppercase;letter-spacing:.8px;
  margin-top:4px;
}

/* Continue button */
.btn-continue{
  display:inline-flex;align-items:center;gap:10px;
  padding:16px 32px;
  background:var(--orange);
  border:none;border-radius:var(--radius);
  color:#fff;font-size:16px;font-weight:700;
  font-family:'DM Sans',sans-serif;
  cursor:pointer;
  transition:background var(--trans),transform var(--trans),box-shadow var(--trans);
  margin-bottom:36px;
}
.btn-continue:hover{
  background:var(--orange-dk);
  transform:translateY(-2px);
  box-shadow:0 8px 28px rgba(255,107,43,.45);
}
.btn-continue:active{transform:translateY(0)}

/* Module cards */
.modules-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:16px;
}
.module-card{
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:22px;cursor:pointer;
  transition:all var(--trans);
  position:relative;overflow:hidden;
}
.module-card::before{
  content:'';
  position:absolute;top:0;left:0;right:0;height:3px;
  background:var(--orange);
  transform:scaleX(0);transform-origin:left;
  transition:transform var(--trans);
}
.module-card:hover{border-color:var(--orange);transform:translateY(-3px)}
.module-card:hover::before{transform:scaleX(1)}
.mc-num{
  font-family:'Bebas Neue',sans-serif;
  font-size:48px;color:rgba(255,107,43,.15);
  line-height:1;margin-bottom:8px;
}
.mc-title{font-size:15px;font-weight:600;margin-bottom:6px}
.mc-sub{font-size:12px;color:var(--text-muted);margin-bottom:14px}
.mc-prog-wrap{height:4px;background:var(--bg4);border-radius:99px;overflow:hidden}
.mc-prog-fill{height:100%;background:var(--orange);border-radius:99px;transition:width 600ms ease}

.dash-section-title{
  font-family:'Bebas Neue',sans-serif;
  font-size:22px;letter-spacing:1px;
  margin-bottom:16px;color:var(--text-muted);
}

/* --- LESSON VIEW --- */
#lessonView{display:none}
#lessonView.visible{display:block}

/* Video container */
.video-wrap{
  position:relative;
  width:100%;padding-top:56.25%;
  background:var(--bg3);
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 0 40px rgba(255,107,43,.15);
  border:1px solid rgba(255,107,43,.12);
  margin-bottom:24px;
}
.video-wrap iframe{
  position:absolute;inset:0;
  width:100%;height:100%;
  border:none;
}
.video-placeholder{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  color:var(--text-muted);
  gap:12px;
}
.video-placeholder .play-icon{
  font-size:56px;opacity:.3;
}
.video-placeholder p{font-size:13px}

/* Lesson info */
.lesson-header{
  display:flex;align-items:flex-start;
  justify-content:space-between;gap:16px;
  margin-bottom:16px;
}
.lesson-header-text{}
.lesson-h-title{
  font-family:'Bebas Neue',sans-serif;
  font-size:32px;letter-spacing:1px;
  line-height:1.1;
}
.lesson-h-meta{
  font-size:13px;color:var(--text-muted);
  margin-top:4px;
}
.btn-done{
  flex-shrink:0;
  display:flex;align-items:center;gap:8px;
  padding:10px 20px;
  background:var(--bg3);
  border:1.5px solid var(--border);
  border-radius:10px;
  color:var(--text-muted);
  font-size:13px;font-weight:600;
  font-family:'DM Sans',sans-serif;
  cursor:pointer;
  transition:all var(--trans);
}
.btn-done:hover{border-color:var(--orange);color:var(--orange)}
.btn-done.done{
  background:rgba(255,107,43,.12);
  border-color:var(--orange);
  color:var(--orange);
}
.lesson-description{
  color:var(--text-muted);
  font-size:14px;line-height:1.7;
  margin-bottom:28px;
  padding-bottom:28px;
  border-bottom:1px solid var(--border);
}

/* Resources */
.resources-title{
  font-size:11px;font-weight:700;
  letter-spacing:1.2px;text-transform:uppercase;
  color:var(--text-muted);margin-bottom:12px;
}
.resources-list{
  display:flex;flex-direction:column;gap:8px;
  margin-bottom:32px;
}
.resource-item{
  display:flex;align-items:center;gap:12px;
  padding:12px 16px;
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:10px;
  cursor:pointer;
  transition:all var(--trans);
  text-decoration:none;color:var(--text);
}
.resource-item:hover{border-color:var(--orange);background:rgba(255,107,43,.06)}
.resource-icon{
  width:34px;height:34px;
  background:rgba(255,107,43,.12);
  border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;flex-shrink:0;
}
.resource-name{font-size:13px;font-weight:500}
.resource-type{font-size:11px;color:var(--text-muted)}

/* Nav buttons */
.nav-btns{
  display:flex;justify-content:space-between;
  gap:12px;padding-top:8px;
}
.nav-btn{
  display:flex;align-items:center;gap:8px;
  padding:12px 22px;
  border:1.5px solid var(--border);
  border-radius:10px;
  background:var(--bg2);
  color:var(--text);
  font-size:13px;font-weight:600;
  font-family:'DM Sans',sans-serif;
  cursor:pointer;
  transition:all var(--trans);
}
.nav-btn:hover:not(:disabled){border-color:var(--orange);color:var(--orange)}
.nav-btn:disabled{opacity:.3;cursor:not-allowed}
.nav-btn.primary{
  background:var(--orange);
  border-color:var(--orange);
  color:#fff;
}
.nav-btn.primary:hover:not(:disabled){background:var(--orange-dk);border-color:var(--orange-dk);color:#fff}

/* =========================================================
   CONFETTI
========================================================= */
#confetti-container{
  position:fixed;inset:0;pointer-events:none;
  z-index:9000;overflow:hidden;
}
.confetti-piece{
  position:absolute;
  top:-10px;
  width:8px;height:14px;
  border-radius:2px;
  animation:confettiFall linear forwards;
}
@keyframes confettiFall{
  0%{transform:translateY(0) rotate(0deg);opacity:1}
  100%{transform:translateY(110vh) rotate(720deg);opacity:0}
}

/* =========================================================
   SIDEBAR OVERLAY (mobile)
========================================================= */
.sidebar-overlay{
  display:none;
  position:fixed;inset:0;
  background:rgba(0,0,0,.7);
  z-index:98;
}

/* =========================================================
   RESPONSIVE
========================================================= */
@media(max-width:768px){
  :root{--sidebar-w:280px}
  .sidebar{
    position:fixed;top:var(--header-h);bottom:0;left:0;
    z-index:99;
    transform:translateX(-100%);
  }
  .sidebar.mobile-open{transform:translateX(0)}
  .sidebar-overlay{display:block}
  .hamburger{display:flex}
  .main{padding:20px 18px 60px}
  .dash-greeting{font-size:38px}
  .header-progress{display:none}
  .lesson-h-title{font-size:24px}
  .video-wrap{border-radius:10px}
}
@media(max-width:480px){
  .stats-row{grid-template-columns:1fr 1fr}
  .nav-btns{flex-direction:column}
  .nav-btn{justify-content:center}
  .lesson-header{flex-direction:column}
}

/* =========================================================
   TOAST NOTIFICATION
========================================================= */
.toast{
  position:fixed;bottom:28px;right:28px;
  background:var(--bg3);
  border:1px solid var(--orange);
  border-radius:12px;
  padding:14px 20px;
  font-size:13px;font-weight:500;
  box-shadow:0 8px 32px rgba(0,0,0,.5),0 0 20px rgba(255,107,43,.2);
  transform:translateY(80px);opacity:0;
  transition:all 400ms cubic-bezier(.4,0,.2,1);
  z-index:9990;
  max-width:280px;
}
.toast.show{transform:translateY(0);opacity:1}

/* Shimmer on active lesson glow */
.lesson-item.active::after{
  content:'';
  position:absolute;left:0;top:0;bottom:0;width:2px;
  background:var(--orange);
  box-shadow:0 0 8px 1px var(--orange);
}
</style>
</head>
<body>

<!-- =====================================================
     🔐 LOGIN SCREEN
===================================================== -->
<div class="screen active" id="loginScreen">
  <div class="login-box">
    <div class="lock-icon">🔐</div>
    <div class="login-logo">Claude<span>PRO</span></div>
    <p class="login-subtitle">Ingresa tu contraseña para acceder al contenido exclusivo</p>
    <label class="login-label" for="pwInput">Contraseña de acceso</label>
    <input
      class="login-input" type="password"
      id="pwInput" placeholder="••••"
      autocomplete="current-password"
      maxlength="20"
    >
    <button class="login-btn" id="loginBtn">Acceder →</button>
    <div class="login-error" id="loginError">❌ Contraseña incorrecta, inténtalo de nuevo</div>
  </div>
</div>

<!-- =====================================================
     📱 APP SCREEN
===================================================== -->
<div class="screen" id="appScreen">

  <!-- HEADER -->
  <header class="header">
    <button class="hamburger" id="hamburger" aria-label="Menú">
      <span></span><span></span><span></span>
    </button>
    <div class="header-logo">Claude<span>PRO</span></div>
    <div class="header-progress">
      <span class="header-progress-label" id="headerProgressLabel">0/9 lecciones</span>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="headerProgressBar" style="width:0%"></div>
      </div>
      <span class="header-progress-label" id="headerProgressPct">0%</span>
    </div>
    <div class="header-actions">
      <button class="btn-logout" id="logoutBtn">⎋ Salir</button>
    </div>
  </header>

  <div class="app-body">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-inner" id="sidebarInner">
        <!-- Generado por JS -->
      </div>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- MAIN CONTENT -->
    <main class="main" id="mainContent">

      <!-- DASHBOARD -->

// ─── Contraseña de acceso ───────────────────────────────────
const ACCESS_PASSWORD = "3214"; // ← Cambia la contraseña aquí

// ─── Claves de localStorage ─────────────────────────────────
const LS_SESSION = "cp_session";
const LS_PROGRESS = "cp_progress";
const LS_CURRENT = "cp_current";

// ─── Estado global ──────────────────────────────────────────
let completedLessons = {}; // { lessonId: true }
let currentLesson = null;  // { moduleIdx, lessonIdx }
let showingDashboard = true;

// ─── Utilidades ─────────────────────────────────────────────
function saveProgress() {
  localStorage.setItem(LS_PROGRESS, JSON.stringify(completedLessons));
}
function loadProgress() {
  try { completedLessons = JSON.parse(localStorage.getItem(LS_PROGRESS)) || {}; }
  catch { completedLessons = {}; }
}
function loadCurrentLesson() {
  try { currentLesson = JSON.parse(localStorage.getItem(LS_CURRENT)); }
  catch { currentLesson = null; }
}
function saveCurrentLesson() {
  localStorage.setItem(LS_CURRENT, JSON.stringify(currentLesson));
}

function totalLessons() {
  return COURSE_DATA.modules.reduce((s, m) => s + m.lessons.length, 0);
}
function completedCount() {
  return Object.keys(completedLessons).filter(k => completedLessons[k]).length;
}
function moduleLessonsCompleted(moduleIdx) {
  return COURSE_DATA.modules[moduleIdx].lessons.filter(l => completedLessons[l.id]).length;
}
function isModuleComplete(moduleIdx) {
  const m = COURSE_DATA.modules[moduleIdx];
  return m.lessons.every(l => completedLessons[l.id]);
}

// Encuentra la siguiente lección sin completar
function nextPendingLesson() {
  for (let mi = 0; mi < COURSE_DATA.modules.length; mi++) {
    const m = COURSE_DATA.modules[mi];
    for (let li = 0; li < m.lessons.length; li++) {
      if (!completedLessons[m.lessons[li].id]) {
        return { moduleIdx: mi, lessonIdx: li };
      }
    }
  }
  return { moduleIdx: 0, lessonIdx: 0 }; // Todas completadas, volver al inicio
}

// ─── LOGIN ───────────────────────────────────────────────────
const loginScreen = document.getElementById("loginScreen");
const appScreen   = document.getElementById("appScreen");
const pwInput     = document.getElementById("pwInput");
const loginBtn    = document.getElementById("loginBtn");
const loginError  = document.getElementById("loginError");

function doLogin() {
  const val = pwInput.value.trim();
  if (val === ACCESS_PASSWORD) {
    localStorage.setItem(LS_SESSION, "1");
    loginScreen.classList.remove("active");
    appScreen.classList.add("active");
    initApp();
  } else {
    loginError.classList.remove("show");
    void loginError.offsetWidth; // reflow para re-trigger animación
    loginError.classList.add("show");
    pwInput.value = "";
    pwInput.focus();
  }
}

loginBtn.addEventListener("click", doLogin);
pwInput.addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });

// Logout
document.getElementById("logoutBtn").addEventListener("click", () => {
  localStorage.removeItem(LS_SESSION);
  appScreen.classList.remove("active");
  loginScreen.classList.add("active");
  pwInput.value = "";
  loginError.classList.remove("show");
});

// Check sesión guardada
if (localStorage.getItem(LS_SESSION) === "1") {
  loginScreen.classList.remove("active");
  appScreen.classList.add("active");
  initApp();
}

// ─── INIT APP ────────────────────────────────────────────────
function initApp() {
  loadProgress();
  loadCurrentLesson();
  buildSidebar();
  buildDashboard();
  updateHeader();
  showDashboard();
}

// ─── HEADER ──────────────────────────────────────────────────
function updateHeader() {
  const total = totalLessons();
  const done  = completedCount();
  const pct   = Math.round((done / total) * 100);
  document.getElementById("headerProgressLabel").textContent = `${done}/${total} lecciones`;
  document.getElementById("headerProgressBar").style.width   = pct + "%";
  document.getElementById("headerProgressPct").textContent   = pct + "%";
}

// ─── SIDEBAR ─────────────────────────────────────────────────
function buildSidebar() {
  const container = document.getElementById("sidebarInner");
  container.innerHTML = `<div class="sidebar-section-title">Contenido del curso</div>`;

  COURSE_DATA.modules.forEach((mod, mi) => {
    const total = mod.lessons.length;
    const done  = moduleLessonsCompleted(mi);
    const pct   = Math.round((done / total) * 100);
    const complete = isModuleComplete(mi);

    const moduleEl = document.createElement("div");
    moduleEl.className = "module-item";
    moduleEl.dataset.mi = mi;
    if (mi === 0) moduleEl.classList.add("open"); // Primer módulo abierto por defecto

    moduleEl.innerHTML = `
      <div class="module-header" data-mi="${mi}">
        <span class="module-chevron">▶</span>
        <div class="module-meta">
          <div class="module-name">${mi + 1}. ${mod.title}</div>
          <div class="module-sub">${done}/${total} lecciones</div>
        </div>
        <span class="module-badge ${complete ? "show" : ""}" id="badge_m${mi}">COMPLETADO</span>
      </div>
      <div class="module-prog" id="modprog_${mi}">
        <div class="module-prog-fill" id="modprogfill_${mi}" style="width:${pct}%"></div>
      </div>
      <div class="lessons-list" id="lessons_m${mi}">
        ${mod.lessons.map((lesson, li) => buildLessonItem(lesson, mi, li)).join("")}
      </div>
    `;
    container.appendChild(moduleEl);

    // Toggle módulo
    moduleEl.querySelector(".module-header").addEventListener("click", () => {
      moduleEl.classList.toggle("open");
    });
  });

  // Lesson click events
  container.querySelectorAll(".lesson-item").forEach(el => {
    el.addEventListener("click", (e) => {
      if (e.target.classList.contains("lesson-check")) return;
      const mi = parseInt(el.dataset.mi);
      const li = parseInt(el.dataset.li);
      openLesson(mi, li);
    });
  });

  // Checkbox click events
  container.querySelectorAll(".lesson-check").forEach(el => {
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      const lid = el.dataset.lid;
      const mi  = parseInt(el.dataset.mi);
      toggleLesson(lid, mi);
    });
  });
}

function buildLessonItem(lesson, mi, li) {
  const done = completedLessons[lesson.id] ? "done" : "";
  const isActive = currentLesson &&
                   currentLesson.moduleIdx === mi &&
                   currentLesson.lessonIdx === li &&
                   !showingDashboard;
  return `
    <div class="lesson-item ${isActive ? "active" : ""}" data-mi="${mi}" data-li="${li}">
      <div class="lesson-check ${done}" data-lid="${lesson.id}" data-mi="${mi}">
        ${done ? "✓" : ""}
      </div>
      <div class="lesson-info">
        <div class="lesson-title">${lesson.title}</div>
        <div class="lesson-duration">⏱ ${lesson.duration}</div>
      </div>
    </div>
  `;
}

function refreshSidebar() {
  buildSidebar();
  // Abrir el módulo activo
  if (currentLesson && !showingDashboard) {
    const moduleEl = document.querySelector(`.module-item[data-mi="${currentLesson.moduleIdx}"]`);
    if (moduleEl) moduleEl.classList.add("open");
  }
}

// ─── DASHBOARD ───────────────────────────────────────────────
function buildDashboard() {
  const total = totalLessons();
  const done  = completedCount();
  const pct   = Math.round((done / total) * 100);
  const modDone = COURSE_DATA.modules.filter((_, i) => isModuleComplete(i)).length;

  // Stats
  const statsRow = document.getElementById("statsRow");
  statsRow.innerHTML = `
    <div class="stat-card">
      <div class="stat-value">${done}</div>
      <div class="stat-label">Lecciones completadas</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">${modDone}</div>
      <div class="stat-label">Módulos completados</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">${pct}%</div>
      <div class="stat-label">Progreso total</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">${total - done}</div>
      <div class="stat-label">Lecciones restantes</div>
    </div>
  `;

  // Module cards
  const grid = document.getElementById("modulesGrid");
  grid.innerHTML = COURSE_DATA.modules.map((mod, mi) => {
    const mTotal = mod.lessons.length;
    const mDone  = moduleLessonsCompleted(mi);
    const mPct   = Math.round((mDone / mTotal) * 100);
    return `
      <div class="module-card" data-mi="${mi}" onclick="openModule(${mi})">
        <div class="mc-num">0${mi + 1}</div>
        <div class="mc-title">${mod.title}</div>
        <div class="mc-sub">${mDone}/${mTotal} lecciones · ${mPct}%</div>
        <div class="mc-prog-wrap">
          <div class="mc-prog-fill" style="width:${mPct}%"></div>
        </div>
      </div>
    `;
  }).join("");

  // Continue button
  document.getElementById("btnContinue").onclick = () => {
    const next = nextPendingLesson();
    openLesson(next.moduleIdx, next.lessonIdx);
  };
}

function showDashboard() {
  showingDashboard = true;
  document.getElementById("dashboard").classList.add("visible");
  document.getElementById("dashboard").style.display = "block";
  document.getElementById("lessonView").style.display = "none";
  document.getElementById("lessonView").classList.remove("visible");
  buildDashboard();
  refreshSidebar();
}

function openModule(mi) {
  openLesson(mi, 0);
}

// ─── LESSON VIEW ─────────────────────────────────────────────
function openLesson(mi, li) {
  currentLesson = { moduleIdx: mi, lessonIdx: li };
  saveCurrentLesson();
  showingDashboard = false;

  document.getElementById("dashboard").style.display = "none";
  document.getElementById("dashboard").classList.remove("visible");
  const lv = document.getElementById("lessonView");
  lv.style.display = "block";
  lv.classList.add("visible");

  const lesson = COURSE_DATA.modules[mi].lessons[li];

  // Video
  const videoWrap = document.getElementById("videoWrap");
  if (lesson.videoUrl) {
    videoWrap.innerHTML = `
      <iframe src="${lesson.videoUrl}?rel=0&modestbranding=1"
        title="${lesson.title}"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen>
      </iframe>
    `;
  } else {
    videoWrap.innerHTML = `
      <div class="video-placeholder">
        <div class="play-icon">▶</div>
        <p>Video próximamente disponible</p>
      </div>
    `;
  }

  // Info
  document.getElementById("lessonTitle").textContent = lesson.title;
  document.getElementById("lessonMeta").textContent =
    `Módulo ${mi + 1}: ${COURSE_DATA.modules[mi].title}  ·  ⏱ ${lesson.duration}`;
  document.getElementById("lessonDescription").textContent = lesson.description;

  // Done button
  const btnDone = document.getElementById("btnMarkDone");
  updateDoneBtn(lesson.id, btnDone);
  btnDone.onclick = () => {
    toggleLesson(lesson.id, mi);
    updateDoneBtn(lesson.id, btnDone);
  };

  // Resources
  const rl = document.getElementById("resourcesList");
  if (lesson.resources && lesson.resources.length > 0) {
    rl.innerHTML = lesson.resources.map(r => `
      <a class="resource-item" href="#" onclick="return false;">
        <div class="resource-icon">${r.icon}</div>
        <div>
          <div class="resource-name">${r.name}</div>
          <div class="resource-type">${r.type}</div>
        </div>
      </a>
    `).join("");
  } else {
    rl.innerHTML = `<p style="color:var(--text-muted);font-size:13px;">Sin recursos en esta lección.</p>`;
  }

  // Nav buttons
  const btnPrev = document.getElementById("btnPrev");
  const btnNext = document.getElementById("btnNext");
  const flat    = getFlatLessons();
  const idx     = flat.findIndex(f => f.mi === mi && f.li === li);

  btnPrev.disabled = idx === 0;
  btnPrev.onclick  = () => {
    if (idx > 0) openLesson(flat[idx - 1].mi, flat[idx - 1].li);
  };

  const isLastInModule = li === COURSE_DATA.modules[mi].lessons.length - 1;
  const isVeryLast     = idx === flat.length - 1;

  if (isVeryLast) {
    btnNext.textContent = "🏆 Finalizar curso";
    btnNext.onclick = () => {
      showToast("🎉 ¡Felicidades, completaste el curso!");
      showDashboard();
    };
  } else if (isLastInModule && mi < COURSE_DATA.modules.length - 1) {
    btnNext.textContent = `Ir al siguiente módulo →`;
    btnNext.onclick = () => openLesson(mi + 1, 0);
  } else {
    btnNext.textContent = "Siguiente →";
    btnNext.onclick = () => openLesson(flat[idx + 1].mi, flat[idx + 1].li);
  }
  btnNext.disabled = false;

  // Sidebar highlight
  refreshSidebar();
  // Scroll main to top
  document.getElementById("mainContent").scrollTop = 0;

  // Close mobile sidebar
  closeMobileSidebar();
}

function getFlatLessons() {
  const flat = [];
  COURSE_DATA.modules.forEach((m, mi) => {
    m.lessons.forEach((l, li) => flat.push({ mi, li, id: l.id }));
  });
  return flat;
}

function updateDoneBtn(lessonId, btn) {
  const done = completedLessons[lessonId];
  btn.textContent = done ? "✓ Completada" : "✓ Marcar completada";
  btn.className   = "btn-done" + (done ? " done" : "");
}

// ─── TOGGLE LESSON COMPLETE ──────────────────────────────────
function toggleLesson(lessonId, mi) {
  completedLessons[lessonId] = !completedLessons[lessonId];
  saveProgress();

  // Actualizar done btn si estamos viendo esa lección
  if (currentLesson && !showingDashboard) {
    const lesson = COURSE_DATA.modules[currentLesson.moduleIdx].lessons[currentLesson.lessonIdx];
    if (lesson.id === lessonId) {
      updateDoneBtn(lessonId, document.getElementById("btnMarkDone"));
    }
  }

  // Actualizar sidebar y header
  refreshSidebar();
  updateHeader();

  // Check módulo completado
  if (isModuleComplete(mi)) {
    const wasJustCompleted = completedLessons[lessonId]; // solo en marca, no en desmarca
    if (wasJustCompleted) {
      triggerConfetti();
      showToast(`🎉 ¡Módulo "${COURSE_DATA.modules[mi].title}" completado!`);
    }
  }

  // Actualizar badge del módulo
  const badge = document.getElementById(`badge_m${mi}`);
  if (badge) badge.classList.toggle("show", isModuleComplete(mi));

  // Actualizar progress fill del módulo
  const fill = document.getElementById(`modprogfill_${mi}`);
  if (fill) {
    const mTotal = COURSE_DATA.modules[mi].lessons.length;
    const mDone  = moduleLessonsCompleted(mi);
    fill.style.width = Math.round((mDone / mTotal) * 100) + "%";
    // También el sub-texto
    const sub = fill.closest(".module-item")?.querySelector(".module-sub");
    if (sub) sub.textContent = `${mDone}/${mTotal} lecciones`;
  }

  buildDashboard();
}

// ─── CONFETTI ─────────────────────────────────────────────────
function triggerConfetti() {
  const container = document.getElementById("confetti-container");
  const colors = ["#FF6B2B","#CC4A10","#F5F0EB","#ffcc00","#ff4488","#44ddff"];
  for (let i = 0; i < 80; i++) {
    const piece = document.createElement("div");
    piece.className = "confetti-piece";
    piece.style.cssText = `
      left:${Math.random() * 100}%;
      background:${colors[Math.floor(Math.random() * colors.length)]};
      width:${6 + Math.random() * 8}px;
      height:${10 + Math.random() * 10}px;
      border-radius:${Math.random() > .5 ? "50%" : "2px"};
      animation-duration:${1.5 + Math.random() * 2}s;
      animation-delay:${Math.random() * .5}s;
    `;
    container.appendChild(piece);
    piece.addEventListener("animationend", () => piece.remove());
  }
}

// ─── TOAST ───────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const toast = document.getElementById("toast");
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 3500);
}

// ─── HAMBURGER (MOBILE) ──────────────────────────────────────
const hamburger = document.getElementById("hamburger");
const sidebar   = document.getElementById("sidebar");
const overlay   = document.getElementById("sidebarOverlay");

hamburger.addEventListener("click", () => {
  const open = sidebar.classList.toggle("mobile-open");
  hamburger.classList.toggle("open", open);
  overlay.style.display = open ? "block" : "none";
});
overlay.addEventListener("click", closeMobileSidebar);

function closeMobileSidebar() {
  sidebar.classList.remove("mobile-open");
  hamburger.classList.remove("open");
  overlay.style.display = "none";
}

// ─── Logo click → dashboard ──────────────────────────────────
document.querySelector(".header-logo").addEventListener("click", showDashboard);
document.querySelector(".header-logo").style.cursor = "pointer";

</script>
